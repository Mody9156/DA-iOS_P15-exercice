name: iOS Build and Test

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-14-xlarge
    steps:
      - uses: actions/checkout@v2

      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.9.1
        with:
          access_token: ${{ github.token }}

      # Installer la dernière version stable d'Xcode
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      # Installer une version stable de Ruby (par exemple 3.2.0)
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.0"  # Remplacez "latest" par une version spécifique de Ruby

      # Installer la dernière version de Bundler
      - name: Install Bundler
        run: gem install bundler

      # Installer les gems nécessaires
      - name: Install gems
        run: bundle install

      # Mise en cache des Swift Packages
      - name: Swift Packages Cache
        uses: actions/cache@v2
        id: cache
        with:
          path: |
            Build/SourcePackages
            Build/Build/Products
          key: ${{ runner.os }}-deps-v1-${{ hashFiles('BILDsolid.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: ${{ runner.os }}-deps-v1-

      # Lister les simulateurs disponibles
      - name: List Available Simulators
        run: |
          xcrun simctl list devices

      # Vérifier si le simulateur iPhone 11 est déjà démarré
      - name: Check if iPhone 11 is Booted
        run: |
          if [[ $(xcrun simctl list devices | grep "iPhone 11" | grep "Booted") ]]; then
            echo "iPhone 11 is already booted."
          else
            echo "iPhone 11 is not booted. Booting now..."
            xcrun simctl boot 8F763915-7035-4E60-BBED-BE48E7319F86
          fi
          xcrun simctl list devices

      # Exécution des tests (sans cache)
      - name: Run Tests (No Cache)
        if: steps.setup.outputs.cache-hit != 'true'
        run: |
          # Exécuter les tests sur l'iPhone 11 avec iOS 16.2
          bundle exec fastlane ios unit_test clean:true skip_package_dependencies_resolution:true platform=ios simulator='iPhone 11' os='16.2'

      # Exécution des tests (avec cache)
      - name: Run Tests (Cache)
        if: steps.setup.outputs.cache-hit == 'true'
        run: |
          # Exécuter les tests avec cache sur l'iPhone 11 avec iOS 16.2
          bundle exec fastlane ios unit_test clean:true skip_package_dependencies_resolution:true platform=ios simulator='iPhone 11' os='16.2'
