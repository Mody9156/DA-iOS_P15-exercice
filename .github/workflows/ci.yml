name: iOS Build and Test

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-14-xlarge
    steps:
      - uses: actions/checkout@v2

      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.9.1
        with:
          access_token: ${{ github.token }}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Installer Ruby 3.x au lieu de 2.7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.0.0  # ou une version plus récente de Ruby (par exemple, 3.1, 3.2)

      - name: Install Bundler
        run: gem install bundler

      - name: Install gems
        run: bundle install

      # Mise en cache des Swift Packages
      - name: Swift Packages Cache
        uses: actions/cache@v2
        id: cache
        with:
          path: |
            Build/SourcePackages
            Build/Build/Products
          key: ${{ runner.os }}-deps-v1-${{ hashFiles('BILDsolid.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: ${{ runner.os }}-deps-v1-

      # Déterminer la version de simulateur disponible et l'utiliser pour les tests
      - name: Run Tests (No Cache)
        if: steps.setup.outputs.cache-hit != 'true'
        run: |
          # Vérifier la liste des simulateurs disponibles et choisir un appareil valide
          xcrun simctl list devices
          # Utiliser un simulateur valide pour les tests
          bundle exec fastlane test skip_package_dependencies_resolution:true platform=ios simulator='iPhone 15 Pro' os='17.0'

      - name: Run Tests (Cache)
        if: steps.setup.outputs.cache-hit == 'true'
        run: |
          # Vérifier la liste des simulateurs disponibles et choisir un appareil valide
          xcrun simctl list devices
          # Exécuter les tests sur un simulateur valide avec cache
          bundle exec fastlane test skip_package_dependencies_resolution:true platform=ios simulator='iPhone 15 Pro' os='17.0'
